# General
model_name_or_path: 'gpt2'
torch_dtype: bfloat16
device: cuda:3
use_chat_template: false
system_prompt: ''

# Generate Vector
steer_train_hparam_paths:
  - ../hparams/Steer/caa_hparams/generate_caa.yaml
steer_train_dataset:
  - sst2_pair

steer_vector_output_dirs:
  - vectors/gpt2

# Apply Vector
apply_steer_hparam_paths:
  - ../hparams/Steer/caa_hparams/apply_caa.yaml

# IMPORTANT: must match the output folder above
steer_vector_load_dir: 
  - vectors/gpt2/sst2_pair/caa_vector

# Generation
generation_data:
  - sst2_pair_val1
  - sst2_pair_val2
generation_data_size: 10000
generation_output_dir: vectors/gpt2/sst2_pair/results/
num_responses: 1
steer_from_end_position: false
generate_orig_output: false
vllm_enable: false

# generation_params:
#   max_new_tokens: 100
#   temperature: 0.9
#   do_sample: true

generation_params:
  max_new_tokens: 32
  temperature: 1
  do_sample: false
